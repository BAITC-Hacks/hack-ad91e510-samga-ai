name: AKIMCitizen
options:
  bundleIdPrefix: kz.hackalem.akim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AKIMCitizen:
    type: application
    platform: iOS
    sources: [Sources, Core, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.hackalem.akim.citizen.demo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: АКИМ Житель
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        NSCameraUsageDescription: Сфотографируйте проблему, чтобы приложить снимок к локальному демо-обращению.
        NSMicrophoneUsageDescription: Запишите голосовое сообщение для локального демо-обращения.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  AKIMCitizen:
    build:
      targets:
        AKIMCitizen: all
    run:
      config: Debug
