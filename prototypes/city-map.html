const names=['Есиль','Алматы','Сарыарка','Байконур','Нура'];

const cats=['Транспорт','Экология','Соцсфера','Безопасность','Сервисы'];
const measures=[
['M1',0,'Выделенные автобусные полосы',18,2,false,{0:6,1:9},'Улучшает движение и доступность автобусов'],
['M2',0,'Умные светофоры',22,2,true,{0:4,7:3},'Разгружает дороги и повышает безопасность движения'],

['M5',1,'Чистое топливо для частного сектора',25,3,false,{3:14,8:4},'Улучшает качество воздуха и надёжность ЖКХ'],
['M6',1,'Городская программа озеленения',20,4,true,{2:5,3:3},'Улучшает озеленение и воздух во всех районах'],
['M7',2,'Школа + детсад',24,3,false,{4:16},'Улучшает обеспеченность школами и детсадами'],
['M8',2,'Центр семейного здоровья',20,3,false,{5:14},'Повышает доступность первичной медпомощи'],
['M9',2,'Дворовые спорт-хабы',10,1,false,{4:3,5:3,6:3},'Небольшие улучшения соцсферы и безопасности'],
['M10',3,'Освещение и камеры',12,1,false,{6:12,7:2},'Повышает безопасность улиц и движения'],
['M11',3,'Безопасные переходы и школьные зоны',10,1,false,{7:12,0:-2},'Безопаснее переходы; разгрузка дорог немного снижается'],
['M12',4,'Платформа обращений жителей',14,1,true,{9:5},'Ускоряет решение обращений во всех районах'],
['M13',4,'Модернизация тепло- и водосетей',28,4,false,{8:18,3:2},'Надёжнее ЖКХ, небольшой эффект для воздуха'],

].map(([id,cat,name,cost,lag,city,effects,description])=>({id,cat,name,cost,lag,city,effects,description}));
const byId=Object.fromEntries(measures.map(m=>[m.id,m]));
const demo=[{id:'M7',d:4},{id:'M8',d:4},{id:'M10',d:4},{id:'M12',d:null},{id:'M5',d:2}];
const alternative=demo.map(x=>x.id==='M5'?{id:'M6',d:null}:{...x});
let selected=demo.map(x=>({...x})), tab='city', category=-1;
const f=(n)=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
function evaluate(sel){
 const rows=base.map(r=>r.slice()),errors=[];let cost=0;const counts=[0,0,0,0,0],ids=sel.map(x=>x.id);
 for(const x of sel){const m=byId[x.id];cost+=m.cost;counts[m.cat]++;const targets=m.city?[0,1,2,3,4]:[x.d];for(const d of targets)for(const [k,v] of Object.entries(m.effects))rows[d][k]+=v*(8-m.lag)/8}
 for(const [a,b,k] of [['M1','M2',0],['M10','M12',6],['M5','M6',3]])if(ids.includes(a)&&ids.includes(b))rows[sel.find(x=>x.id===a).d][k]+=2;
 if(sel.length!==5)errors.push('Выбрано '+sel.length+' из 5 мероприятий.');
 if(cost>100)errors.push('Бюджет превышен на '+(cost-100)+' ед.');
 if(new Set(ids).size!==ids.length)errors.push('Мероприятия не должны повторяться.');
 if(counts.some(x=>x>2))errors.push('Допустимо не более двух мер одного направления.');
 if(ids.includes('M1')&&ids.includes('M3'))errors.push('Автобусные полосы и ЛРТ несовместимы.');
 for(const [a,b] of [['M4','M7'],['M5','M13']])if(ids.includes(a)&&ids.includes(b)&&sel.find(x=>x.id===a).d===sel.find(x=>x.id===b).d)errors.push(byId[a].name+' и '+byId[b].name+' несовместимы в одном районе.');
 rows.forEach(r=>r.forEach((v,k)=>r[k]=Math.max(0,Math.min(100,v))));
 const ds=rows.map(r=>r.reduce((s,v,k)=>s+v*weights[k],0)),avg=ds.reduce((s,v,i)=>s+v*pop[i],0),crit=rows.flat().filter(x=>x<40).length;
 return {rows,ds,avg,crit,cost,score:.7*avg+.3*Math.min(...ds)-crit,errors};
}

function changeDistrict(id,value){selected.find(x=>x.id===id).d=Number(value);render()}

 ['Бюджет плана',r.cost+' <span class="muted" style="font-size:16px;font-weight:400">/ 100</span>',(100-r.cost>=0?'Осталось '+(100-r.cost):'Превышение '+(r.cost-100))+' условных единиц'],

 return '<svg class="map-svg" viewBox="0 0 1000 760" role="img" aria-label="Схема пяти районов модели '+(source==='base'?'до решений':'после решений')+'"><defs><pattern id="terrain-'+id+'" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="6" cy="10" r="1" fill="#c7d3bc" opacity=".5"/><circle cx="30" cy="29" r=".8" fill="#c7d3bc" opacity=".5"/></pattern><clipPath id="city-'+id+'">'+paths.map(d=>'<path d="'+d+'"/>').join('')+'</clipPath></defs><rect width="1000" height="760" fill="url(#terrain-'+id+')"/><g transform="translate('+(500-500*zoom)+' '+(380-380*zoom)+') scale('+zoom+')">'+shapes.map((s,i)=>'<path class="district-path '+(focusDistrict===i&&!mini?'selected':'')+'" d="'+s.d+'" fill="'+mapColor(layerValue(result,i))+'" onclick="selectMapDistrict('+i+')" tabindex="0" role="button" aria-label="Выбрать район '+names[i]+'" onkeydown="if(event.key===\'Enter\')selectMapDistrict('+i+')"/>').join('')+'<g clip-path="url(#city-'+id+')" pointer-events="none">'+blocks+roads+'<path d="M140 554 Q170 512 199 553 Q217 607 179 624 Q141 611 140 554Z" fill="#b2cdd0" opacity=".8"/><path d="M800 294 Q820 258 845 288 Q859 315 843 343Z" fill="#91b491" opacity=".55"/></g><path d="M-25 376 C70 374 117 381 184 408 S261 424 325 370 S417 376 453 393 S549 395 578 405 S646 354 704 388 S788 448 847 418 S930 433 1030 465" fill="none" stroke="#f4f7eb" stroke-width="22" pointer-events="none"/><path d="M-25 376 C70 374 117 381 184 408 S261 424 325 370 S417 376 453 393 S549 395 578 405 S646 354 704 388 S788 448 847 418 S930 433 1030 465" fill="none" stroke="#a7c9d0" stroke-width="14" pointer-events="none"/><path d="M-25 376 C70 374 117 381 184 408 S261 424 325 370 S417 376 453 393 S549 395 578 405 S646 354 704 388 S788 448 847 418 S930 433 1030 465" fill="none" stroke="#d1e6e7" stroke-width="2" opacity=".7" pointer-events="none"/><text x="501" y="377" fill="#6f9aa1" font-size="10" letter-spacing="3" transform="rotate(8 501 377)">ЕСИЛЬ</text>'+
 shapes.map((s,i)=>{const val=layerValue(result,i),crit=result.rows[i].filter(v=>v<40).length;return '<g transform="translate('+s.x+','+s.y+')" pointer-events="none"><rect class="badge-bg" x="-57" y="-25" width="114" height="76" rx="8"/><text class="district-title" text-anchor="middle" y="-3">'+names[i].toUpperCase()+'</text><text class="district-value" text-anchor="middle" y="24">'+f(val)+'</text><text class="district-sub" text-anchor="middle" y="41">'+(crit?crit+' критич. показателя':Math.round(pop[i]*100)+'% населения')+'</text></g>'}).join('')+pins+'</g></svg>';
}
function comparisonSource(){return schoolLocked?{r:evaluate(strategies.affordable.selections),name:'Без обязательной школы',sel:strategies.affordable.selections}:{r:reference,name:'Пример организаторов',sel:demo}}
function render(){
 const r=evaluate(selected),valid=!r.errors.length,isBase=scene===1,shown=isBase||!mapFuture?baseline:r;
 document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',Number(b.dataset.scene)===scene));
 document.getElementById('page-title').textContent=scene===1?'Где городу нужна помощь':scene===2?'Выберите план и проверьте последствия':'Сколько стоит ваш приоритет';
 document.getElementById('page-subtitle').textContent=scene===1?'Нура: два критических показателя. Откройте район, чтобы начать.':scene===2?'Выбранные меры меняют показатели районов на карте.':'Два сценария на одной шкале. Вы видите и выигрыш, и цену решения.';
 document.getElementById('time-switch').style.display=scene===3?'none':'flex';
 document.getElementById('time-before').classList.toggle('active',!mapFuture||scene===1);document.getElementById('time-after').classList.toggle('active',mapFuture&&scene!==1);
 document.getElementById('time-after').disabled=!selected.length;
 if(scene!==3){
 document.getElementById('map-holder').innerHTML=drawMap(shown,'main',false,mapFuture&&scene===2)+'<div class="map-top"><div class="map-note"><div class="eyebrow muted">'+(scene===1||!mapFuture?'ИСХОДНОЕ СОСТОЯНИЕ':'ЭФФЕКТ ЧЕРЕЗ 2 ГОДА')+'</div><h3>'+(scene===1?'Начните с Нуры':labels[strategyKey])+'</h3><p>'+(scene===1?'Школы — 38. Медпомощь — 35.':(valid?'Score '+f(r.score)+' · '+r.cost+' из 100 единиц':'План требует исправлений'))+'</p></div><div style="display:flex;gap:6px"><button class="small" onclick="zoom=Math.min(1.5,zoom+.15);render()" aria-label="Увеличить карту">+</button><button class="small" onclick="zoom=Math.max(.7,zoom-.15);render()" aria-label="Уменьшить карту">−</button><div class="north">N<br>↑</div></div></div><div class="map-bottom"><div class="legend"><div class="small" style="margin-bottom:6px;font-size:10px">'+(mapLayer==='overall'?'Оценка района':mapLayer==='social'?'Соцсфера: среднее S1 и S2':mapLayer==='air'?'Качество воздуха E2':'Транспорт: среднее T1 и T2')+' · больше лучше</div><div class="scale"></div><div class="legend-labels"><span>ниже 40</span><span>50</span><span>60</span><span>65+</span></div></div><div class="map-credit">Схема пяти районов модели.<br>Границы и точки мер условные.</div></div>';
 }else{
 const a=comparisonSource(),b=r,delta=b.score-a.r.score,dc=b.cost-a.r.cost,dn=b.ds[4]-a.r.ds[4];
 document.getElementById('map-holder').innerHTML='<div class="comparison"><div class="compare-maps"><div class="mini-map"><div class="mini-map-top"><span>'+a.name+'</span><strong>'+a.r.cost+' ед.</strong></div>'+drawMap(a.r,'compare-a',true,false)+'</div><div class="mini-map"><div class="mini-map-top"><span>'+(schoolLocked?'Школа в Нуре обязательна':labels[strategyKey])+'</span><strong>'+b.cost+' ед.</strong></div>'+drawMap(b,'compare-b',true,false)+'</div></div><div class="compare-bottom"><div><div class="label">Изменение расходов</div><strong>'+(dc>0?'+':'')+dc+' <span class="small">ед.</span></strong><p>'+a.r.cost+' → '+b.cost+'</p></div><div><div class="label">Изменение Score</div><strong>'+(delta>0?'+':'')+f(delta)+'</strong><p>'+f(a.r.score)+' → '+f(b.score)+'</p></div><div><div class="label">Изменение Нуры</div><strong>'+(dn>0?'+':'')+f(dn)+'</strong><p>'+f(a.r.ds[4])+' → '+f(b.ds[4])+'</p></div></div><div class="small muted" style="font-size:9px">Схемы районов модели. Условные границы. Шкала цвета одинакова.</div></div>';
 }
 renderPanel(r);
 const displayScore=isBase?baseline.score:r.score;
 document.getElementById('budget-score').textContent=isBase||valid?f(displayScore):'—';
 document.getElementById('budget-score-label').textContent=isBase?'Исходный Score':'Score выбранного плана';
 document.getElementById('budget-cost').innerHTML=(isBase?0:r.cost)+' <small>/ 100 ед.</small>';
 document.getElementById('budget-fill').style.width=Math.min(100,isBase?0:r.cost)+'%';
 document.getElementById('budget-critical').textContent=(isBase?baseline.crit:r.crit);
 document.getElementById('budget-count').innerHTML=(isBase?0:selected.length)+' <small>/ 5 решений</small>';
 document.getElementById('action-main').textContent=scene===1?'Подобрать варианты →':scene===2?'Сравнить решения →':'Скачать решение ↓';
 document.getElementById('action-secondary').textContent=scene===1?'Методика расчёта':scene===2?'Изменить вручную':'Вернуться к плану';
}
function renderPanel(r){
 const d=focusDistrict;
 if(scene===1){
 const criticalIndices=base[d].map((v,k)=>v<40?k:-1).filter(k=>k>=0);
 document.getElementById('panel').innerHTML='<div class="panel-head"><span class="eyebrow muted">ПАСПОРТ РАЙОНА</span><span class="tag">'+Math.round(pop[d]*100)+'% населения</span></div><h2 class="district-heading">'+names[d]+'</h2><p class="district-meta">'+descriptions[d]+'</p><div class="critical"><h3>'+(criticalIndices.length?criticalIndices.length+' показателя требуют внимания':'Критических показателей нет')+'</h3><p>Порог модели: строго ниже 40 из 100.</p></div><div class="metrics">'+[4,5,0,1,3].map(k=>'<div class="metric"><span>'+metricNames[k]+'</span><strong class="'+(base[d][k]<40?'negative':'')+'">'+base[d][k]+' <small>/100</small></strong></div>').join('')+'</div><button class="wide" onclick="showDistrict('+d+')">Все показатели района ↗</button><div class="initial-cta"><p>Подберите пять мер для всего города. Условия можно закрепить перед выбором.</p><button class="primary wide" onclick="go(2)">Посмотреть три стратегии →</button></div><div class="mini-rule">Критичность относится к отдельным показателям. Все исходные числа взяты из датасета.</div>';
 }else if(scene===2){
 document.getElementById('panel').innerHTML='<div class="panel-head"><span class="eyebrow muted">РЕШЕНИЯ ДЛЯ ГОРОДА</span><span class="tag">3 стратегии</span></div><h2 style="font-size:21px;margin-bottom:14px">Выберите приоритет</h2>'+['quality','weakest','affordable'].map(k=>{const s=chosen(k);return '<button class="scenario '+(strategyKey===k?'active':'')+'" onclick="pickStrategy(\''+k+'\')"><div class="scenario-title"><span>'+labels[k]+'</span><span>'+s.cost+' ед.</span></div><div class="scenario-values"><span>'+(k==='quality'?'Максимальный Score':k==='weakest'?'Выше оценка слабейшего района':'Ноль критических показателей')+'</span><strong>'+f(s.score)+'</strong></div></button>'}).join('')+'<label class="lock"><input type="checkbox" '+(schoolLocked?'checked':'')+' onchange="toggleSchool()"><span>Школа в Нуре обязательна</span></label>'+(schoolLocked?'<p class="mini-rule">Минимальная цена без критических показателей: 80 вместо 66 единиц.</p>':'')+'<div class="plan-title">Выбранные меры · '+selected.length+'/5</div>'+selected.map((x,i)=>{const m=byId[x.id];return '<div class="plan-measure"><div><p>'+(i+1)+'. '+m.name+'</p><small>'+(m.city?'Все районы':names[x.d])+' · лаг '+m.lag+' кв.</small></div><strong>'+m.cost+'</strong></div>'}).join('')+(r.errors.length?'<div class="invalid">'+r.errors.join('<br>')+'</div>':'<div class="mini-rule positive">✓ Проверены бюджет, состав и совместимость</div>')+'<p class="mini-rule">Варианты рассчитаны заранее. Текст AI в макете — пример.</p>';
 }else{
 const a=comparisonSource(),removed=a.sel.filter(x=>!selected.some(y=>x.id===y.id&&x.d===y.d)),added=selected.filter(x=>!a.sel.some(y=>x.id===y.id&&x.d===y.d));
 document.getElementById('panel').innerHTML='<div class="panel-head"><span class="eyebrow muted">ОБОСНОВАНИЕ РЕШЕНИЯ</span><span class="tag">Пример AI-текста</span></div><h2 style="font-size:22px">Цена вашего условия</h2><div class="reason">'+(schoolLocked&&strategyKey==='affordable'?'<strong>Обязательная школа стоит дополнительных 14 единиц.</strong> Спорт-хабы заменены школой и детсадом. Показатель школ Нуры повышается с 40,63 до 48,00; оба плана устраняют критические значения.':'Сравните расходы и показатели районов. Рост общего Score может распределяться между районами неравномерно.')+'</div><div class="plan-title">Что меняется</div>'+removed.map(x=>'<div class="switch-row from"><span class="from">Убрать</span><br>'+byId[x.id].name+' · '+(byId[x.id].city?'город':names[x.d])+'</div>').join('')+added.map(x=>'<div class="switch-row"><span class="to">Добавить</span><br>'+byId[x.id].name+' · '+(byId[x.id].city?'город':names[x.d])+'</div>').join('')+'<div class="reason"><strong>Проверьте и обратную сторону.</strong> '+(removed.some(x=>x.id==='M9')&&added.some(x=>x.id==='M7')?'Замена спорт-хабов школой убирает их сопутствующие эффекты на медпомощь и безопасность.':'Сравните изменения всех показателей, включая возможные потери от заменённых мер.')+' Подробности доступны при нажатии на район.</div><button class="wide" onclick="showCompareDetails()">Точная разница по Нуре ↗</button><button class="primary download" onclick="downloadPlan()">Скачать выбранное решение ↓</button><p class="mini-rule">Модель учебная. Рост школьного показателя от спорт-хабов — условие датасета, а не замена реальной школы.</p>';
 }
}
function showCompareDetails(){const a=comparisonSource().r,b=evaluate(selected);openDetail('<div class="eyebrow">НУРА · СРАВНЕНИЕ ПЛАНОВ</div><h1>Что именно изменилось</h1><div class="metric-row muted"><span>Показатель</span><span>План А</span><span>План Б</span></div>'+metricNames.map((n,k)=>'<div class="metric-row"><span>'+n+'</span><span>'+f(a.rows[4][k])+'</span><strong class="'+(b.rows[4][k]<a.rows[4][k]?'negative':'positive')+'">'+f(b.rows[4][k])+'</strong></div>').join('')+'<p class="small muted">Все эффекты включают задержки и синергии. Результат — условная оценка модели.</p>')}
function showMeasure(id){const m=byId[id];openDetail('<span class="tag">'+cats[m.cat]+' · '+id+'</span><h1>'+m.name+'</h1><p>'+m.description+'. Стоимость '+m.cost+' единиц, задержка '+m.lag+' квартала.</p><p>Полные эффекты умножаются на (8 − '+m.lag+') / 8.</p>'+Object.entries(m.effects).map(([k,v])=>'<div class="metric-row"><span>'+metricNames[k]+'</span><span>'+(v>0?'+':'')+v+'</span><strong>'+(v>0?'+':'')+f(v*(8-m.lag)/8)+'</strong></div>').join('')+'<p class="small muted">Точка обозначает привязку меры к району, не конкретное место строительства.</p>')}
function mainAction(){if(scene===1)go(2);else if(scene===2)go(3);else downloadPlan()}
function secondaryAction(){if(scene===1)showRules();else if(scene===2)showEditor();else go(2)}
function showProof(){openDetail('<h1>От исходных данных к решению</h1><p>Районы и 14 мероприятий взяты из DOCX. Валидатор проверяет пять разных мер, бюджет до 100, максимум две меры направления и несовместимости.</p><p>Полный локальный перебор дал 694 395 допустимых сценариев. Выбранные результаты дополнительно проверены десятичной арифметикой. В макете поиск не запускается заново: используются рассчитанные наборы.</p><p>AI-советник в рабочем проекте будет переводить пожелания в ограничения, вызывать поиск и объяснять результат. Числа вычисляет код.</p><p>Карта — схема пяти условных районов задания. В современных официальных материалах Астаны шесть районов; эта схема не является административной картой.</p><p>Подробные правила DOCX допускают минимум три направления. Трактовку пяти направлений в PDF необходимо уточнить у организаторов.</p>')}
function showEditor(open=true){const html='<div class="eyebrow">РЕДАКТОР ПЛАНА</div><h1>Пять управленческих решений</h1>'+selected.map(x=>{const m=byId[x.id];return '<div class="editor-row"><span>'+m.name+' · '+m.cost+' ед.</span>'+(m.city?'<span>Весь город</span>':'<select '+(schoolLocked&&x.id==='M7'?'disabled':'')+' onchange="editDistrict(\''+x.id+'\',this.value)">'+names.map((n,i)=>'<option value="'+i+'" '+(x.d===i?'selected':'')+'>'+n+'</option>').join('')+'</select>')+'<button '+(schoolLocked&&x.id==='M7'?'disabled':'')+' onclick="editRemove(\''+x.id+'\')" aria-label="Удалить '+m.name+'">×</button></div>'}).join('')+'<div class="editor-label">Добавить мероприятие</div>'+measures.filter(m=>!selected.some(x=>x.id===m.id)).map(m=>'<div class="editor-add"><span>'+m.name+' · '+m.cost+'</span>'+(m.city?'<span>Весь город</span>':'<select id="district-'+m.id+'">'+names.map((n,i)=>'<option value="'+i+'" '+(i===4?'selected':'')+'>'+n+'</option>').join('')+'</select>')+'<button '+(selected.length>=5?'disabled':'')+' onclick="editAdd(\''+m.id+'\')">Добавить</button></div>').join('')+'<p class="small">'+(evaluate(selected).errors.join(' ')||'Правила соблюдены. Score '+f(evaluate(selected).score))+'</p>';document.getElementById('detail-content').innerHTML=html;if(open&&!document.getElementById('detail').open)document.getElementById('detail').showModal()}
function editRemove(id){selected=selected.filter(x=>x.id!==id);strategyKey='custom';render();showEditor(false)}
function editAdd(id){if(selected.length>=5)return;const m=byId[id];selected.push({id,d:m.city?null:Number(document.getElementById('district-'+id).value)});strategyKey='custom';render();showEditor(false)}
function editDistrict(id,v){selected.find(x=>x.id===id).d=Number(v);strategyKey='custom';render();showEditor(false)}
function downloadPlan(){const r=evaluate(selected);if(r.errors.length){toast('Сначала исправьте ограничения плана');return}const lines=['Samga — выбранное решение','Синтетическая модель HackAlem','',...selected.map(x=>byId[x.id].name+' / '+(byId[x.id].city?'весь город':names[x.d])+' / '+byId[x.id].cost+' ед.'),'','Расход: '+r.cost+' / 100','Score: '+f(r.score),'Критических показателей: '+r.crit,'',...names.map((n,i)=>n+': '+f(baseline.ds[i])+' → '+f(r.ds[i])),'','Условия DOCX: ровно пять мер, максимум две меры направления.'];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='samga-city-decision.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Решение сохранено')}
selected=[];render();
</script></body></html>
